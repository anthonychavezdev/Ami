# Ami in containers: MariaDB, coturn (the TURN relay for calls) and the
# server, which also serves the browser app. Copy .env.example to .env, set
# the two secrets, then `docker compose up -d`. docs/deployment.md#docker
# covers TLS, backups and upgrades. AMI_PORT and AMI_TURN_PORT (8080 and
# 3478 unless .env says otherwise) are the ports published on this machine.
# Every container: no privilege escalation, logs capped so they cannot fill
# the disk. The server also runs on a read-only root with no capabilities;
# it writes only to its media volume.
x-hardened: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *hardened
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ami
      MARIADB_USER: ami
      MARIADB_PASSWORD: ${AMI_DB_PASSWORD:?set AMI_DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # coturn relays calls between networks that cannot reach each other
  # directly. The server mints its credentials from the same secret
  # (docs/calls.md#get-apiice). Behind Docker's NAT it must advertise the
  # machine's public address: AMI_PUBLIC_IP, or the one it detects itself.
  # It relays only to public addresses (never into this machine's networks),
  # with a cap on allocations per user and in total.
  turn:
    <<: *hardened
    image: coturn/coturn:4.6
    environment:
      AMI_TURN_SECRET: ${AMI_TURN_SECRET:?set AMI_TURN_SECRET in .env}
      AMI_PUBLIC_IP: ${AMI_PUBLIC_IP:-}
    entrypoint: ["sh", "-c"]
    command:
      - >
        exec turnserver -n --log-file=stdout --realm=ami --fingerprint --no-tls
        --use-auth-secret --static-auth-secret="$$AMI_TURN_SECRET"
        --listening-port=3478 --min-port=49160 --max-port=49200
        --external-ip="$${AMI_PUBLIC_IP:-$$(detect-external-ip)}"
        --no-multicast-peers --user-quota=32 --total-quota=2000
        --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=::1
        --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    ports:
      - "${AMI_TURN_PORT:-3478}:3478/udp"
      - "${AMI_TURN_PORT:-3478}:3478/tcp"
      - "49160-49200:49160-49200/udp"

  server:
    <<: *hardened
    build: .
    image: ami-server
    read_only: true
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    environment:
      AMI_DB: ami:${AMI_DB_PASSWORD}@tcp(db:3306)/ami
      AMI_TURN_SECRET: ${AMI_TURN_SECRET}
      AMI_TURN_PORT: ${AMI_TURN_PORT:-3478}
      AMI_INVITE: ${AMI_INVITE:-}
      AMI_DEV: ${AMI_DEV:-}
      AMI_USER_STORAGE_GB: ${AMI_USER_STORAGE_GB:-0}
    ports:
      - "${AMI_PORT:-8080}:8080"
    volumes:
      - media:/data/media

volumes:
  db:
  media:
